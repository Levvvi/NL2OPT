[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2opt"
version = "0.1.0"
description = "Chinese natural language to optimization model agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3,<4",
    "openai>=1.0",
    "ortools>=9.10",
    "pydantic>=2,<3",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nl2opt.solvers.templates" = ["*.j2"]
"nl2opt.eval" = ["*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
