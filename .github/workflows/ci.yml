name: Locked offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install exact locked dependencies
        run: uv sync --locked --extra dev
      - name: Run tests without model credentials
        run: uv run --no-sync pytest -q
      - name: Validate the self-built dataset
        run: uv run --no-sync python -m nl2opt.eval.case_quality --difficulty all
      - name: Run four deterministic examples
        run: uv run --no-sync python examples/run_all_basic.py --timeout-sec 30
      - name: Verify reproducible evidence and fault rejection
        run: uv run --no-sync python scripts/export_portfolio_evidence.py --output-dir outputs/ci-portfolio-evidence
